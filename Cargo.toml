[package]
name = "zerocad"
version = "0.1.0"
edition = "2024"

[dependencies]
# Релиз 0.20.1 (git master несобираем снаружи: path-зависимости hyper*).
# Минимум фич: f64 — тип чисел, delaunay — триангуляция крышек при экструзии.
csgrs = { version = "0.20.1", default-features = false, features = ["f64", "delaunay"] }

# core2 (обязательная зависимость csgrs) янкнут с crates.io и репозиторий
# выпотрошен автором (апрель 2026), поэтому код 0.4.0 вендорен из git-истории.
[patch.crates-io]
core2 = { path = "vendor/core2" }

# BSP-булевы в debug невыносимо медленные; зависимости собираем с оптимизацией,
# свой код остаётся быстрым в компиляции.
[profile.dev.package."*"]
opt-level = 2
